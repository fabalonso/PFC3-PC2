<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Encuentra puntos de acopio y coordina recojos de material reciclable en Lima.">
  <meta name="theme-color" content="#f5f7f4">
  <title>Iniciar sesión | ReCircula Lima</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script type="module" src="/assets/main.js"></script>
</head>
<body data-page="login">
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <header class="masthead">
    <div class="wrap masthead-inner">
      <a class="brand" href="/" aria-label="ReCircula Lima, inicio"><span class="brand-mark" aria-hidden="true">↻</span><span>ReCircula <strong>Lima</strong></span></a>
      <nav class="main-nav" aria-label="Navegación principal"><a href="/">Inicio</a><a href="/acopio">Acopio</a><a href="/ofertas">Ofertas</a><a href="/actividad">Mi actividad</a></nav>
      <div id="account-nav" class="account-nav"><a class="nav-login" href="/iniciar-sesion">Iniciar sesión</a><a class="button button-compact" href="/registro">Crear cuenta</a></div>
    </div>
  </header>
  <main id="contenido" class="wrap">
    <p id="account-notice" class="status account-notice" role="status"></p>
    <section class="account-layout login-layout" aria-labelledby="login-title">
      <div class="account-intro">
        <h1 id="login-title">Inicia sesión</h1>
        <p>Accede a tus publicaciones o a tus recojos.</p>
      </div>
      <form id="login-form" class="card auth-form" method="post">
        <label class="field"><span>Correo electrónico</span><input name="email" type="email" autocomplete="email" maxlength="254" placeholder="nombre@ejemplo.com" required></label>
        <label class="field"><span>Contraseña</span><input name="password" type="password" autocomplete="current-password" maxlength="128" required></label>
        <p id="auth-feedback" class="status" role="status"></p>
        <button class="button" type="submit">Iniciar sesión</button>
        <p class="form-secondary">¿Aún no tienes cuenta? <a class="text-link" href="/registro">Regístrate</a>.</p>
      </form>
    </section>
  </main>
  <footer class="wrap footer"><span>ReCircula Lima</span><span>Datos de demostración</span></footer>
</body>
</html>
