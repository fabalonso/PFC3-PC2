name: CI/CD · ReCircula Lima

on:
  pull_request:
    branches: [main]
  push:
    branches: [test, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build del frontend
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  test:
    name: Pruebas de integración con PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: recircula_ci
          POSTGRES_DB: recircula_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recircula_ci -d recircula_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://recircula_ci@127.0.0.1:5432/recircula_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  sast:
    name: Seguridad · SAST con Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Instalar Semgrep
        run: python3 -m pip install --disable-pip-version-check semgrep==1.185.0
      - name: Analizar frontend y backend
        run: semgrep scan --config p/default --config .semgrep.yml --metrics=off --error app.js src web
